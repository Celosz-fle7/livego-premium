name: Bootstrap Stable Android TV Project

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap_android.yml'

permissions:
  contents: write

jobs:
  bootstrap-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.22.0
          channel: stable

      - name: Create Android project once
        run: |
          set -eux
          flutter --version
          flutter create --platforms=android --project-name livego_premium .
          echo "=== android directory after flutter create ==="
          find android -maxdepth 3 -type f | sort | head -200

      - name: Patch Android TV manifest, banner, and black theme
        run: |
          set -eux
          python3 - << 'PATCH_ANDROID_TV'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit(f"AndroidManifest.xml not found: {manifest}")

          s = manifest.read_text()

          def add_after_manifest_open(text, snippet):
              if snippet.strip() in text:
                  return text
              needle = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
              if needle not in text:
                  raise SystemExit("Unsupported AndroidManifest.xml root")
              return text.replace(needle, needle + "\n" + snippet.rstrip(), 1)

          manifest_inserts = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />',
              '    <uses-feature android:name="android.software.leanback" android:required="false" />',
              '    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />',
          ]
          for snippet in reversed(manifest_inserts):
              s = add_after_manifest_open(s, snippet)

          if 'android:banner="@drawable/tv_banner"' not in s:
              s = s.replace('<application', '<application android:banner="@drawable/tv_banner"', 1)

          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)

          leanback_filter = "\n".join([
              "            <intent-filter>",
              "                <action android:name=\"android.intent.action.MAIN\" />",
              "                <category android:name=\"android.intent.category.LEANBACK_LAUNCHER\" />",
              "            </intent-filter>",
          ])

          https_deeplink_filter = "\n".join([
              "            <intent-filter android:autoVerify=\"true\">",
              "                <action android:name=\"android.intent.action.VIEW\" />",
              "                <category android:name=\"android.intent.category.DEFAULT\" />",
              "                <category android:name=\"android.intent.category.BROWSABLE\" />",
              "                <data android:scheme=\"https\" android:host=\"livego.app\" android:pathPrefix=\"/content\" />",
              "            </intent-filter>",
          ])

          app_deeplink_filter = "\n".join([
              "            <intent-filter>",
              "                <action android:name=\"android.intent.action.VIEW\" />",
              "                <category android:name=\"android.intent.category.DEFAULT\" />",
              "                <category android:name=\"android.intent.category.BROWSABLE\" />",
              "                <data android:scheme=\"livego\" android:host=\"content\" />",
              "            </intent-filter>",
          ])

          activity_match = re.search(r'(<activity[\s\S]*?</activity>)', s)
          if not activity_match:
              raise SystemExit("No activity block found in AndroidManifest.xml")
          activity = activity_match.group(1)
          updated_activity = activity

          for block, marker in [
              (leanback_filter, 'android.intent.category.LEANBACK_LAUNCHER'),
              (https_deeplink_filter, 'android:host="livego.app"'),
              (app_deeplink_filter, 'android:scheme="livego"'),
          ]:
              if marker not in updated_activity:
                  updated_activity = updated_activity.replace('</activity>', block + "\n        </activity>", 1)

          if updated_activity != activity:
              s = s.replace(activity, updated_activity, 1)

          manifest.write_text(s)

          drawable_dir = Path("android/app/src/main/res/drawable")
          drawable_dir.mkdir(parents=True, exist_ok=True)
          tv_banner_xml = "\n".join([
              '<?xml version="1.0" encoding="utf-8"?>',
              '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">',
              '    <gradient',
              '        android:startColor="#020617"',
              '        android:centerColor="#06324A"',
              '        android:endColor="#00D4FF"',
              '        android:angle="0" />',
              '    <corners android:radius="0dp" />',
              '</shape>',
              '',
          ])
          (drawable_dir / "tv_banner.xml").write_text(tv_banner_xml)

          styles_xml = "\n".join([
              '<?xml version="1.0" encoding="utf-8"?>',
              '<resources>',
              '    <style name="LaunchTheme" parent="@android:style/Theme.Material.NoActionBar">',
              '        <item name="android:windowBackground">#000000</item>',
              '        <item name="android:windowNoTitle">true</item>',
              '        <item name="android:windowActionBar">false</item>',
              '        <item name="android:windowFullscreen">true</item>',
              '        <item name="android:windowDisablePreview">true</item>',
              '        <item name="android:statusBarColor">#000000</item>',
              '        <item name="android:navigationBarColor">#000000</item>',
              '    </style>',
              '',
              '    <style name="NormalTheme" parent="@android:style/Theme.Material.NoActionBar">',
              '        <item name="android:windowBackground">#000000</item>',
              '        <item name="android:windowNoTitle">true</item>',
              '        <item name="android:windowActionBar">false</item>',
              '        <item name="android:windowFullscreen">true</item>',
              '        <item name="android:windowDisablePreview">true</item>',
              '        <item name="android:statusBarColor">#000000</item>',
              '        <item name="android:navigationBarColor">#000000</item>',
              '    </style>',
              '</resources>',
              '',
          ])

          for d in [Path("android/app/src/main/res/values"), Path("android/app/src/main/res/values-night")]:
              d.mkdir(parents=True, exist_ok=True)
              (d / "styles.xml").write_text(styles_xml)
          PATCH_ANDROID_TV

      - name: Debug git state before commit
        run: |
          set -eux
          echo "=== pwd ==="
          pwd
          echo "=== root files ==="
          ls -la
          echo "=== android exists ==="
          ls -la android
          echo "=== git status before add ==="
          git status --short
          echo "=== ignored check ==="
          git check-ignore -v android android/app android/app/src || true

      - name: Force add and commit Android project
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f android
          echo "=== git status after git add -f android ==="
          git status --short

          if git diff --cached --quiet; then
            echo "[FAIL] android/ exists but no files were staged."
            find android -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          git commit -m "Add stable Android TV project"
          git push origin HEAD:main
