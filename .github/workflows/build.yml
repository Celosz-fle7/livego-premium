name: Build LiveGO Premium APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.22.0
          channel: stable

      - name: Recreate Android project
        run: |
          flutter create --platforms=android --project-name livego_premium .
          rm -rf test
          python3 - << 'FIX'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">", "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"android.permission.INTERNET\" />")
          p.write_text(s)
          FIX

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze || true

      - name: Build universal release APK
        run: flutter build apk --release --dart-define=API_SECRET=${{ secrets.API_SECRET }} --dart-define=API_BASE_URL=https://api-drama.dobda.id --dart-define=API_LANG=id

      - name: Prepare files
        run: |
          cd build/app/outputs/flutter-apk
          cp app-release.apk LiveGO-Premium.apk
          zip -9 livego-premium-artifact.zip LiveGO-Premium.apk
          ls -lh

      - name: Upload compressed artifact
        uses: actions/upload-artifact@v4
        with:
          name: livego-premium-artifact
          path: build/app/outputs/flutter-apk/livego-premium-artifact.zip

      - name: Send APK to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FILE="build/app/outputs/flutter-apk/LiveGO-Premium.apk"
          SIZE=$(stat -c%s "$FILE")
          LIMIT=50000000

          if [ "$SIZE" -le "$LIMIT" ]; then
            curl -F chat_id="$CHAT_ID" \
                 -F document=@"$FILE" \
                 -F caption="LiveGO Premium APK" \
                 "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            echo "APK lebih dari 50MB, tidak dikirim Telegram."
          fi
