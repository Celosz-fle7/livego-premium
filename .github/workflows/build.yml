name: Build LiveGO Premium APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.22.0
          channel: stable

      - name: Recreate Android project
        run: |
          flutter create --platforms=android --project-name livego_premium .
          rm -rf test

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze || true

      - name: Build release split APK
        run: flutter build apk --release --split-per-abi

      - name: Compress arm64 APK
        run: |
          cd build/app/outputs/flutter-apk
          zip livego-premium-arm64.zip app-arm64-v8a-release.apk
          ls -lh livego-premium-arm64.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: livego-premium-arm64
          path: build/app/outputs/flutter-apk/livego-premium-arm64.zip

      - name: Send ZIP to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -F chat_id="$CHAT_ID" \
               -F document="@build/app/outputs/flutter-apk/livego-premium-arm64.zip" \
               -F caption="LiveGO Premium ARM64 Release APK" \
               "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
