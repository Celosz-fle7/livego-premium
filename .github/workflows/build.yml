name: Build LiveGO Premium APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.22.0
          channel: stable

      - name: Recreate Android project
        run: |
          flutter create --platforms=android --project-name livego_premium .
          rm -rf test

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze || true

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Compress APK
        run: |
          cd build/app/outputs/flutter-apk
          zip -9 livego-premium-universal.zip app-release.apk
          ls -lh app-release.apk livego-premium-universal.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: livego-premium-universal
          path: build/app/outputs/flutter-apk/livego-premium-universal.zip

      - name: Send ZIP to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FILE="build/app/outputs/flutter-apk/livego-premium-universal.zip"
          SIZE=$(stat -c%s "$FILE")
          LIMIT=50000000

          if [ "$SIZE" -le "$LIMIT" ]; then
            curl -F chat_id="$CHAT_ID" \
                 -F document=@"$FILE" \
                 -F caption="LiveGO Premium Universal APK" \
                 "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            echo "ZIP lebih dari 50MB, hanya upload ke GitHub artifact."
          fi
