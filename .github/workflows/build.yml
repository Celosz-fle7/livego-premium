name: Build LiveGO Premium APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.22.0
          channel: stable

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze || true

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Prepare files
        run: |
          cd build/app/outputs/flutter-apk
          cp app-release.apk LiveGO-Premium.apk
          zip -9 livego-premium-artifact.zip LiveGO-Premium.apk
          ls -lh

      - name: Upload compressed artifact
        uses: actions/upload-artifact@v4
        with:
          name: livego-premium-artifact
          path: build/app/outputs/flutter-apk/livego-premium-artifact.zip

      - name: Send APK to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FILE="build/app/outputs/flutter-apk/LiveGO-Premium.apk"
          SIZE=$(stat -c%s "$FILE")
          LIMIT=50000000

          if [ -n "$BOT_TOKEN" ] && [ -n "$CHAT_ID" ] && [ "$SIZE" -le "$LIMIT" ]; then
            curl -F chat_id="$CHAT_ID" \
                 -F document=@"$FILE" \
                 -F caption="LiveGO Premium APK" \
                 "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            echo "Skip Telegram: missing token/chat id or APK > 50MB."
          fi
