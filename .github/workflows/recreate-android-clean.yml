name: Recreate Android Clean Universal

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch hasil recreate Android"
        required: true
        default: "android-recreate-clean"
      flutter_channel:
        description: "Flutter channel"
        required: true
        default: "stable"

permissions:
  contents: write

jobs:
  recreate_android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel }}
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Prepare clean branch
        run: |
          git checkout -B "${{ inputs.target_branch }}"

      - name: Backup current android folder as artifact source
        run: |
          rm -rf /tmp/livego_android_backup
          mkdir -p /tmp/livego_android_backup
          if [ -d android ]; then
            cp -a android /tmp/livego_android_backup/android-before-recreate
          fi

      - name: Upload old android backup
        uses: actions/upload-artifact@v4
        with:
          name: android-before-recreate
          path: /tmp/livego_android_backup/android-before-recreate
          if-no-files-found: ignore

      - name: Recreate Android folder
        run: |
          rm -rf android
          flutter create \
            --platforms=android \
            --org com.livego \
            --project-name livego_premium \
            .

      - name: Patch Android universal black bootstrap
        run: python3 .github/scripts/recreate_android_clean.py

      - name: Flutter pub get
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Commit recreated Android folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git status --short
          git add -A android .metadata pubspec.lock

          if git diff --cached --quiet; then
            echo "No Android recreate changes to commit."
            exit 0
          fi

          git commit -m "Recreate Android folder clean universal"
          git push --force-with-lease origin "${{ inputs.target_branch }}"
