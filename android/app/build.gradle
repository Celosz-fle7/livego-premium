plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def livegoReleaseStoreFile = System.getenv("LIVEGO_RELEASE_STORE_FILE")
def livegoReleaseStorePassword = System.getenv("LIVEGO_RELEASE_STORE_PASSWORD")
def livegoReleaseKeyAlias = System.getenv("LIVEGO_RELEASE_KEY_ALIAS")
def livegoReleaseKeyPassword = System.getenv("LIVEGO_RELEASE_KEY_PASSWORD")
def livegoHasReleaseSigning =
        livegoReleaseStoreFile != null && livegoReleaseStoreFile.trim().length() > 0 &&
        livegoReleaseStorePassword != null && livegoReleaseStorePassword.trim().length() > 0 &&
        livegoReleaseKeyAlias != null && livegoReleaseKeyAlias.trim().length() > 0 &&
        livegoReleaseKeyPassword != null && livegoReleaseKeyPassword.trim().length() > 0

android {
    namespace = "com.livego.premium"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.livego.premium"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        release {
            if (livegoHasReleaseSigning) {
                storeFile = file(livegoReleaseStoreFile)
                storePassword = livegoReleaseStorePassword
                keyAlias = livegoReleaseKeyAlias
                keyPassword = livegoReleaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (!livegoHasReleaseSigning) {
                throw new GradleException("Missing LiveGo release signing env. Set LIVEGO_RELEASE_STORE_FILE, LIVEGO_RELEASE_STORE_PASSWORD, LIVEGO_RELEASE_KEY_ALIAS, and LIVEGO_RELEASE_KEY_PASSWORD.")
            }
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.4.1"
    implementation "androidx.media3:media3-ui:1.4.1"
}
