allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "org.jetbrains.kotlin" &&
                    (details.requested.name == "kotlin-stdlib" ||
                     details.requested.name == "kotlin-stdlib-jdk7" ||
                     details.requested.name == "kotlin-stdlib-jdk8")) {
                details.useVersion("1.8.22")
                details.because("Align Kotlin stdlib artifacts to prevent duplicate class errors in release builds.")
            }
        }
    }
    afterEvaluate { project ->
        if (project.extensions.findByName("android") != null) {
            try {
                project.android {
                    compileSdkVersion 34
                    buildToolsVersion "34.0.0"
                }
            } catch (Exception ignored) {}
        }
    }
    tasks.configureEach { task ->
        if (task.name == "verifyReleaseResources" || task.name == "verifyDebugResources") {
            task.enabled = false
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
