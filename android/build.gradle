allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "org.jetbrains.kotlin" &&
                    (details.requested.name == "kotlin-stdlib" ||
                     details.requested.name == "kotlin-stdlib-jdk7" ||
                     details.requested.name == "kotlin-stdlib-jdk8")) {
                details.useVersion("1.8.22")
                details.because("Align Kotlin stdlib artifacts to prevent duplicate class errors in release builds.")
            }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
